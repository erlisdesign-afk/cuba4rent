<svg viewBox="0 0 420 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agente Ana - Cuba4Rent">
  <defs>
    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0C142E" flood-opacity="0.13"/>
    </filter>
    <filter id="bubble-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0C142E" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="desk-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A882"/>
      <stop offset="100%" stop-color="#A88860"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3460"/>
      <stop offset="100%" stop-color="#0C142E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="420" height="280" fill="#F5E6C8" rx="20"/>

  <!-- Decorative circles background -->
  <circle cx="85" cy="200" r="130" fill="#0C142E" opacity="0.05"/>
  <circle cx="370" cy="60" r="60" fill="#E63946" opacity="0.06"/>

  <!-- Floating dots -->
  <circle cx="360" cy="230" r="4" fill="#E63946" opacity="0.35"/>
  <circle cx="375" cy="218" r="2.5" fill="#E63946" opacity="0.25"/>
  <circle cx="25" cy="80" r="5" fill="#0C142E" opacity="0.12"/>
  <circle cx="38" cy="68" r="3" fill="#0C142E" opacity="0.08"/>

  <!-- ── DESK ── -->
  <rect x="30" y="192" width="250" height="16" rx="5" fill="url(#desk-grad)"/>
  <!-- Desk legs -->
  <rect x="50" y="208" width="10" height="52" rx="4" fill="#A88860"/>
  <rect x="250" y="208" width="10" height="52" rx="4" fill="#A88860"/>

  <!-- ── LAPTOP BASE ── -->
  <rect x="70" y="175" width="140" height="18" rx="4" fill="#1a2a4e"/>
  <!-- hinge -->
  <rect x="130" y="172" width="20" height="5" rx="2.5" fill="#0C142E"/>

  <!-- ── LAPTOP SCREEN ── -->
  <rect x="75" y="108" width="130" height="70" rx="6" fill="#0C142E"/>
  <rect x="80" y="113" width="120" height="60" rx="3" fill="url(#screen-grad)"/>
  <!-- Screen content -->
  <rect x="88" y="120" width="55" height="4" rx="2" fill="white" opacity="0.55"/>
  <rect x="88" y="129" width="38" height="4" rx="2" fill="#E63946" opacity="0.8"/>
  <rect x="88" y="138" width="70" height="3" rx="1.5" fill="white" opacity="0.28"/>
  <rect x="88" y="145" width="50" height="3" rx="1.5" fill="white" opacity="0.22"/>
  <rect x="88" y="153" width="62" height="3" rx="1.5" fill="white" opacity="0.18"/>
  <!-- Camera dot -->
  <circle cx="140" cy="116" r="2" fill="#ffffff" opacity="0.4"/>

  <!-- ── CHARACTER ── -->

  <!-- Chair back (subtle) -->
  <rect x="104" y="148" width="72" height="46" rx="8" fill="#0C142E" opacity="0.15"/>

  <!-- Torso / blouse - navy with red collar accent -->
  <path d="M108 160 Q110 148 120 144 L140 140 L160 144 Q170 148 172 160 L170 195 L110 195 Z" fill="#0C142E"/>
  <!-- Collar accent -->
  <path d="M130 140 L140 152 L150 140 Q145 136 140 135 Q135 136 130 140Z" fill="#E63946"/>
  <!-- Small pin/badge -->
  <circle cx="122" cy="158" r="4" fill="#E63946"/>
  <circle cx="122" cy="158" r="2" fill="#F5E6C8"/>

  <!-- Arms -->
  <!-- Left arm reaching to laptop -->
  <path d="M112 162 Q96 170 88 180" stroke="#C47A52" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- Left hand -->
  <ellipse cx="86" cy="182" rx="8" ry="6" fill="#C47A52"/>
  <!-- Right arm on desk -->
  <path d="M168 162 Q180 170 188 180" stroke="#C47A52" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- Right hand -->
  <ellipse cx="190" cy="182" rx="8" ry="6" fill="#C47A52"/>

  <!-- Neck -->
  <rect x="131" y="124" width="18" height="18" rx="6" fill="#C47A52"/>

  <!-- Head -->
  <ellipse cx="140" cy="112" rx="24" ry="26" fill="#C47A52"/>

  <!-- Hair - dark voluminous -->
  <!-- Back hair -->
  <ellipse cx="140" cy="94" rx="26" ry="16" fill="#2A1800"/>
  <!-- Side hair left -->
  <ellipse cx="116" cy="110" rx="7" ry="16" fill="#2A1800"/>
  <!-- Side hair right -->
  <ellipse cx="164" cy="110" rx="7" ry="16" fill="#2A1800"/>
  <!-- Top hair -->
  <ellipse cx="140" cy="88" rx="23" ry="13" fill="#3D2510"/>
  <!-- Hair highlight -->
  <ellipse cx="133" cy="85" rx="8" ry="5" fill="#4A2E14" opacity="0.6"/>

  <!-- Ear -->
  <ellipse cx="116" cy="112" rx="4" ry="5" fill="#B86A42"/>
  <ellipse cx="164" cy="112" rx="4" ry="5" fill="#B86A42"/>

  <!-- Headset -->
  <path d="M117 100 Q117 82 140 80 Q163 82 163 100" stroke="#0C142E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="113" y="100" width="8" height="14" rx="4" fill="#0C142E"/>
  <rect x="159" y="100" width="8" height="14" rx="4" fill="#0C142E"/>
  <!-- Mic boom -->
  <path d="M121 114 Q110 120 106 128" stroke="#0C142E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="105" cy="129" r="3" fill="#E63946"/>

  <!-- Eyes -->
  <ellipse cx="132" cy="112" rx="4" ry="4.5" fill="white"/>
  <ellipse cx="148" cy="112" rx="4" ry="4.5" fill="white"/>
  <circle cx="133" cy="112" r="2.5" fill="#2A1800"/>
  <circle cx="149" cy="112" r="2.5" fill="#2A1800"/>
  <!-- Eye shine -->
  <circle cx="134" cy="110.5" r="1" fill="white"/>
  <circle cx="150" cy="110.5" r="1" fill="white"/>

  <!-- Eyebrows -->
  <path d="M128 106 Q132 104 136 106" stroke="#2A1800" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M144 106 Q148 104 152 106" stroke="#2A1800" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M133 120 Q140 126 147 120" stroke="#8B4513" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Teeth hint -->
  <path d="M135 121 Q140 124.5 145 121" fill="white" opacity="0.7"/>

  <!-- Cheek blush -->
  <ellipse cx="126" cy="118" rx="5" ry="3" fill="#E63946" opacity="0.2"/>
  <ellipse cx="154" cy="118" rx="5" ry="3" fill="#E63946" opacity="0.2"/>

  <!-- ── SPEECH BUBBLE ── -->
  <g filter="url(#bubble-shadow)">
    <rect x="240" y="74" width="155" height="110" rx="16" fill="white"/>
    <!-- Tail pointing left to Ana -->
    <path d="M248 130 L225 142 L244 118" fill="white"/>
  </g>

  <!-- WhatsApp circle -->
  <circle cx="290" cy="112" r="28" fill="#25D366"/>
  <!-- WA icon simplified -->
  <path d="M290 88c-13.3 0-24 10.7-24 24 0 4.3 1.1 8.3 3.1 11.8L266 136l12.5-3.3c3.3 1.7 7 2.7 11 2.7 13.3 0 24-10.7 24-24s-10.7-24-24-24zm11.9 33.3c-.5 1.4-2.9 2.7-4 2.8-1 .2-2.4.2-7.6-.3-6.6-.6-12.2-5.7-12.6-6.1-.4-.4-3.8-5-3.8-9.7 0-4.7 2.5-6.9 3.4-7.9.9-1 1.9-1.1 2.5-1.1h1.8c.6 0 1 .1 1.4 1 .5 1 1.6 4 1.8 4.3.2.3.2.6 0 1-.2.4-.4.6-.8 1-.4.4-.7.7-1 1-.4.4-.8.8-.3 1.7.5.9 2 3.4 4.4 5.5 3 2.7 5.6 3.5 6.5 3.9.9.4 1.4.3 1.9-.2.6-.6 2.4-2.8 3.1-3.8.6-.9 1.3-.7 2.1-.4.9.4 5.5 2.6 6.4 3 .9.5 1.5.7 1.7 1 .2.4-.1 1.8-.7 3.3z" fill="white"/>

  <!-- Bubble text -->
  <text x="330" y="103" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#0C142E" font-weight="700">¡Hola! 👋</text>
  <text x="322" y="118" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#555">Reserva en</text>
  <text x="317" y="131" font-family="'Segoe UI', sans-serif" font-size="9.5" fill="#555">menos de</text>
  <text x="316" y="144" font-family="'Segoe UI', sans-serif" font-size="10" fill="#E63946" font-weight="700">30 minutos ⚡</text>

  <!-- Small stars / sparkles -->
  <text x="378" y="72" font-size="14">✦</text>
  <text x="220" y="65" font-size="10" fill="#E63946" opacity="0.5">✦</text>
</svg>
