<svg viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reserva tu auto en Cuba - 3 pasos">
  <defs>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0C142E" flood-opacity="0.18"/>
    </filter>
    <filter id="icon-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0C142E" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="road-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0C142E" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0C142E"/>
      <stop offset="80%" stop-color="#0C142E"/>
      <stop offset="100%" stop-color="#0C142E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="body-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F04050"/>
      <stop offset="100%" stop-color="#C02030"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="100%" stop-color="#EDD8B0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="300" fill="url(#bg-grad)" rx="20"/>

  <!-- Background navy circle -->
  <circle cx="160" cy="165" r="118" fill="#0C142E" opacity="0.07"/>

  <!-- Decorative dots -->
  <circle cx="292" cy="36" r="5" fill="#E63946" opacity="0.3"/>
  <circle cx="306" cy="50" r="3" fill="#E63946" opacity="0.2"/>
  <circle cx="22" cy="258" r="6" fill="#0C142E" opacity="0.1"/>
  <circle cx="36" cy="270" r="3.5" fill="#0C142E" opacity="0.07"/>

  <!-- ── ROAD ── -->
  <ellipse cx="160" cy="248" rx="130" ry="14" fill="url(#road-grad)"/>
  <!-- Road dashes -->
  <rect x="100" y="244" width="20" height="4" rx="2" fill="white" opacity="0.3"/>
  <rect x="132" y="244" width="20" height="4" rx="2" fill="white" opacity="0.3"/>
  <rect x="164" y="244" width="20" height="4" rx="2" fill="white" opacity="0.3"/>
  <rect x="196" y="244" width="20" height="4" rx="2" fill="white" opacity="0.3"/>

  <!-- ── CLASSIC CAR (1950s American convertible, side view facing right) ── -->
  <g transform="translate(52, 155)">

    <!-- Car shadow -->
    <ellipse cx="108" cy="86" rx="95" ry="10" fill="#0C142E" opacity="0.15"/>

    <!-- Body main shape -->
    <path d="
      M8 68
      L8 52
      Q10 44 22 38
      L52 34
      Q62 18 82 14
      L136 14
      Q158 14 168 28
      L182 38
      Q196 40 198 52
      L200 68
      Q196 76 188 76
      L20 76
      Q10 76 8 68 Z
    " fill="url(#body-grad)"/>

    <!-- Car roof / windshield area (open convertible — just windshield frame) -->
    <path d="M72 34 L68 14 L90 10 L116 10 L130 14 L126 34 Z" fill="#C02030"/>
    <!-- Windshield glass -->
    <path d="M78 32 L75 16 L90 12 L116 12 L126 16 L122 32 Z" fill="#87CEEB" opacity="0.5"/>
    <!-- Windshield frame -->
    <path d="M78 32 L75 16 L90 12 L116 12 L126 16 L122 32" stroke="#0C142E" stroke-width="2" fill="none" stroke-linejoin="round"/>

    <!-- Chrome trim line along body -->
    <path d="M14 58 Q100 52 198 56" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Door lines -->
    <path d="M88 38 L86 74" stroke="#A01820" stroke-width="1.5" opacity="0.5"/>
    <path d="M130 36 L128 74" stroke="#A01820" stroke-width="1.5" opacity="0.5"/>

    <!-- Front grill -->
    <rect x="190" y="48" width="12" height="20" rx="4" fill="#F5C842"/>
    <!-- Grill lines -->
    <line x1="192" y1="52" x2="200" y2="52" stroke="#D4A030" stroke-width="1.5"/>
    <line x1="192" y1="56" x2="200" y2="56" stroke="#D4A030" stroke-width="1.5"/>
    <line x1="192" y1="60" x2="200" y2="60" stroke="#D4A030" stroke-width="1.5"/>

    <!-- Front headlight -->
    <ellipse cx="197" cy="44" rx="7" ry="5" fill="#F5E6C8"/>
    <ellipse cx="197" cy="44" rx="5" ry="3.5" fill="#F5C842" opacity="0.8"/>

    <!-- Rear tail fin (characteristic 1950s) -->
    <path d="M8 52 Q4 44 10 34 L22 38 L8 52Z" fill="#D02030"/>

    <!-- Tail light -->
    <ellipse cx="10" cy="46" rx="4" ry="6" fill="#FF4444"/>
    <ellipse cx="10" cy="46" rx="2.5" ry="4" fill="#FF8888"/>

    <!-- Front bumper chrome -->
    <path d="M188 68 Q200 66 204 60 Q206 68 200 74 L188 74Z" fill="#E8E0D0"/>
    <!-- Rear bumper chrome -->
    <path d="M12 68 Q4 66 2 60 Q0 68 4 74 L12 74Z" fill="#E8E0D0"/>

    <!-- ── WHEELS ── -->
    <!-- Rear wheel -->
    <circle cx="46" cy="76" r="22" fill="#1a1a2e"/>
    <circle cx="46" cy="76" r="18" fill="#2a2a3e"/>
    <!-- Hubcap rear -->
    <circle cx="46" cy="76" r="12" fill="#E8E0D0"/>
    <circle cx="46" cy="76" r="8" fill="#C0B898"/>
    <circle cx="46" cy="76" r="4" fill="#E8E0D0"/>
    <!-- Spokes rear -->
    <line x1="46" y1="64" x2="46" y2="88" stroke="#A8A090" stroke-width="1.5"/>
    <line x1="34" y1="76" x2="58" y2="76" stroke="#A8A090" stroke-width="1.5"/>
    <line x1="37.5" y1="67.5" x2="54.5" y2="84.5" stroke="#A8A090" stroke-width="1.5"/>
    <line x1="54.5" y1="67.5" x2="37.5" y2="84.5" stroke="#A8A090" stroke-width="1.5"/>
    <!-- Whitewall rear -->
    <circle cx="46" cy="76" r="22" fill="none" stroke="white" stroke-width="3" opacity="0.35"/>

    <!-- Front wheel -->
    <circle cx="166" cy="76" r="22" fill="#1a1a2e"/>
    <circle cx="166" cy="76" r="18" fill="#2a2a3e"/>
    <!-- Hubcap front -->
    <circle cx="166" cy="76" r="12" fill="#E8E0D0"/>
    <circle cx="166" cy="76" r="8" fill="#C0B898"/>
    <circle cx="166" cy="76" r="4" fill="#E8E0D0"/>
    <!-- Spokes front -->
    <line x1="166" y1="64" x2="166" y2="88" stroke="#A8A090" stroke-width="1.5"/>
    <line x1="154" y1="76" x2="178" y2="76" stroke="#A8A090" stroke-width="1.5"/>
    <line x1="157.5" y1="67.5" x2="174.5" y2="84.5" stroke="#A8A090" stroke-width="1.5"/>
    <line x1="174.5" y1="67.5" x2="157.5" y2="84.5" stroke="#A8A090" stroke-width="1.5"/>
    <!-- Whitewall front -->
    <circle cx="166" cy="76" r="22" fill="none" stroke="white" stroke-width="3" opacity="0.35"/>

    <!-- Interior steering wheel hint -->
    <circle cx="98" cy="30" r="8" fill="none" stroke="#8B2018" stroke-width="2.5"/>
    <line x1="98" y1="22" x2="98" y2="38" stroke="#8B2018" stroke-width="2"/>
    <line x1="90" y1="30" x2="106" y2="30" stroke="#8B2018" stroke-width="2"/>

    <!-- Driver silhouette (subtle) -->
    <ellipse cx="98" cy="20" rx="10" ry="11" fill="#8B2018" opacity="0.5"/>
    <rect x="88" y="22" width="20" height="16" rx="4" fill="#8B2018" opacity="0.4"/>

  </g>

  <!-- ── FLOATING ICON CARDS ── -->

  <!-- Card 1: Calendar (top left) -->
  <g filter="url(#icon-shadow)" transform="translate(18, 42)">
    <rect width="72" height="72" rx="14" fill="white"/>
    <!-- Calendar icon -->
    <rect x="16" y="20" width="40" height="34" rx="5" fill="#0C142E"/>
    <rect x="16" y="20" width="40" height="14" rx="5" fill="#E63946"/>
    <!-- Calendar binding rings -->
    <rect x="25" y="14" width="6" height="12" rx="3" fill="#0C142E"/>
    <rect x="41" y="14" width="6" height="12" rx="3" fill="#0C142E"/>
    <!-- Calendar dots -->
    <circle cx="25" cy="42" r="2.5" fill="white"/>
    <circle cx="33" cy="42" r="2.5" fill="white"/>
    <circle cx="41" cy="42" r="2.5" fill="#E63946"/>
    <circle cx="49" cy="42" r="2.5" fill="white"/>
    <circle cx="25" cy="50" r="2.5" fill="white"/>
    <circle cx="33" cy="50" r="2.5" fill="white"/>
    <!-- Label -->
    <text x="36" y="67" font-family="'Segoe UI',sans-serif" font-size="9" fill="#0C142E" font-weight="700" text-anchor="middle">Elige fecha</text>
  </g>

  <!-- Card 2: Map pin (top right) -->
  <g filter="url(#icon-shadow)" transform="translate(230, 28)">
    <rect width="72" height="72" rx="14" fill="white"/>
    <!-- Map pin icon -->
    <path d="M36 16 C26 16 18 24 18 34 C18 46 36 62 36 62 C36 62 54 46 54 34 C54 24 46 16 36 16Z" fill="#E63946"/>
    <circle cx="36" cy="34" r="8" fill="white"/>
    <circle cx="36" cy="34" r="4" fill="#E63946"/>
    <!-- Label -->
    <text x="36" y="69" font-family="'Segoe UI',sans-serif" font-size="9" fill="#0C142E" font-weight="700" text-anchor="middle">Tu ciudad</text>
  </g>

  <!-- Card 3: Checkmark (bottom right) -->
  <g filter="url(#icon-shadow)" transform="translate(234, 190)">
    <rect width="72" height="72" rx="14" fill="#0C142E"/>
    <!-- Check circle -->
    <circle cx="36" cy="32" r="20" fill="#E63946"/>
    <path d="M26 32 L33 39 L46 24" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Label -->
    <text x="36" y="65" font-family="'Segoe UI',sans-serif" font-size="9" fill="white" font-weight="700" text-anchor="middle">Confirmado</text>
  </g>

  <!-- Connecting dotted arc lines between cards and car -->
  <path d="M90 112 Q120 100 140 130" stroke="#0C142E" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.25"/>
  <path d="M231 112 Q210 100 200 130" stroke="#0C142E" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.25"/>

  <!-- Step numbers in circles -->
  <circle cx="90" cy="112" r="12" fill="#E63946"/>
  <text x="90" y="116.5" font-family="'Segoe UI',sans-serif" font-size="11" fill="white" font-weight="800" text-anchor="middle">1</text>

  <circle cx="230" cy="112" r="12" fill="#E63946"/>
  <text x="230" y="116.5" font-family="'Segoe UI',sans-serif" font-size="11" fill="white" font-weight="800" text-anchor="middle">2</text>

  <circle cx="270" cy="226" r="12" fill="#0C142E"/>
  <text x="270" y="230.5" font-family="'Segoe UI',sans-serif" font-size="11" fill="white" font-weight="800" text-anchor="middle">3</text>
</svg>
